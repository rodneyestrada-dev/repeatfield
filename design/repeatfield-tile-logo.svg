<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Repeatfield tile mark</title>
  <desc id="desc">A warm cream square tile with orange quarter-circle lines at opposite corners.</desc>
  <rect width="100" height="100" rx="18" fill="#fff7ee"/>
  <circle cx="0" cy="0" r="50" fill="none" stroke="#ff8c24" stroke-width="12"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#ff8c24" stroke-width="12"/>
</svg>
